services:
  postgres:
    image: postgres:15-alpine
    container_name: kongpay_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kongpay_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kongpay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  kongpay-backend:
    build: .
    container_name: kongpay_backend
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/kongpay_db?sslmode=disable
    ports:
      - "8443:8443"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: kongpay_prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - kongpay-backend
    restart: always

volumes:
  pgdata:
